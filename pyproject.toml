[project]
name = "agent_scaling"
version = "2.1.3"
description = "Replication package for multi-agent architecture and model-composition experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.6.0",
    "docker>=7.0.0",
    "hydra-core>=1.3.2",
    "langchain>=0.3.26",
    "langchain-litellm>=0.2.1",
    "litellm[caching]>=1.73.6",
    "loguru>=0.7.3",
    "orjson>=3.10.18",
    "pandas>=2.0",
    "plancraft>=0.4.9",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
langfuse = [
    "langfuse>=3.0",
]
swebench = [
    "swebench>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

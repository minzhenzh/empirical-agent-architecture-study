task_description_template: |-
  Complete a realistic business request by interacting with the provided
  WorkBench business tools.

task_description_with_tools_template: >-
  Complete a realistic business request by interacting with the provided
  WorkBench business tools. Tool calls execute against the benchmark's mock
  databases. Use submit only after the required state-changing actions have
  been executed. The benchmark's fixed current date and time is Thursday,
  November 30, 2023 at 00:00:00. Meetings must not start before 09:00 or end
  after 18:00.

task_behavior_template: |-
  When doing the task:
  - Carefully read the instructions and identify the user's intent.
  - Resolve relative dates against Thursday, November 30, 2023.
  - Use search and lookup tools when IDs or existing records are needed.
  - Execute the minimum set of state-changing actions needed to complete the
    request; do not merely describe hypothetical actions.
  - Call submit when the task is complete.

task_instance_template: |-
  Task ID: {{task_id}}
  Instructions: {{question}}

task_output_template: |-
  Your final submission should briefly state what was completed. The evaluator
  scores the actual WorkBench actions and resulting mock-database state.

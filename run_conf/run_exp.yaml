defaults:
  - agent: single-agent
  - dataset: plancraft-test
  - llm: deepseek-v4-flash
  - override hydra/job_logging: disabled
  - _self_

log_langfuse: false
use_disk_cache: false
num_workers: 1
debug: false
max_instances: ${dataset.max_instances}
run_name: ${agent.name}_${dataset.dataset_id}_${now:%Y-%m-%d}_${now:%H-%M-%S}

hydra:
  verbose: false
  run:
    dir: exp_outputs/${dataset.dataset_id}/${agent.name}/${hydra:runtime.choices.llm}/${now:%Y-%m-%d}/${now:%H-%M-%S}
